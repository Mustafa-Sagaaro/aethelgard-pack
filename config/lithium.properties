# Radium (Lithium for Forge) mixin overrides - Chronicles of Aethelgard
# Immersive Cinematics 0.3.5 redirects a call inside ChunkMap#move for camera chunk loading;
# Radium's player_chunk_tick optimisation rewrites the same method, so the two cannot both apply.
# Disabling this single Radium optimisation resolves the crash; everything else stays enabled.
mixin.world.player_chunk_tick=false
